name: PR Verification
on:
  pull_request:
    branches: [ main, master ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Lint
      run: npm run lint
    - name: Build
      run: npm run build
